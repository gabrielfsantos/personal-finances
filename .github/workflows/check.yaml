name: Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Check Depends-On Status
        uses: depends-on/depends-on-action@c7ac9a6932a7069e83aef80c202d9f60f91e43fd
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  prepare-workspace:
    needs: check-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Fetch and Merge Dependent PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          DEPENDS_ON_LINE=$(echo "$PR_BODY" | grep -iE "depends-on:" | head -n 1)

          if [ -n "$DEPENDS_ON_LINE" ]; then
            PR_NUMBER=$(echo "$DEPENDS_ON_LINE" | grep -oE '[0-9]+' | head -n 1)

            if [ -n "$PR_NUMBER" ]; then
              echo "Dependency detected: PR #$PR_NUMBER"

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              echo "Fetching PR #$PR_NUMBER..."
              git fetch origin pull/$PR_NUMBER/head:dependent-pr-$PR_NUMBER

              echo "Merging PR #$PR_NUMBER into current workspace..."
              git merge dependent-pr-$PR_NUMBER --allow-unrelated-histories --no-edit || {
                echo "::error::Failed to merge PR #$PR_NUMBER due to conflicts or git merge error."
                git status
                exit 1
              }
            else
              echo "Depends-On tag found, but no valid PR number could be extracted."
            fi
          else
            echo "No Depends-On dependency found"
          fi

      - name: Upload Prepared Workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-workspace-${{ github.run_id }}
          path: .
          include-hidden-files: true
          retention-days: 1

  format-check:
    runs-on: ubuntu-latest
    needs: prepare-workspace
    steps:
      - name: Download Prepared Workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-workspace-${{ github.run_id }}

      - name: Restore Bazel Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-check-${{ runner.os }}-${{ hashFiles('**/*.bzl', '**/BUILD.bazel', 'MODULE.bazel') }}
          restore-keys: |
            bazel-release-${{ runner.os }}-

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2

      - name: Format check
        run: bazel run //tools/format:format.check

  lint-tidy:
    runs-on: ubuntu-latest
    needs: prepare-workspace
    steps:
      - name: Download Prepared Workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-workspace-${{ github.run_id }}

      - name: Restore Bazel Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-check-${{ runner.os }}-${{ hashFiles('**/*.bzl', '**/BUILD.bazel', 'MODULE.bazel') }}
          restore-keys: |
            bazel-release-${{ runner.os }}-

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2

      - name: Lint / Tidy
        run: bazel build //... --config=tidy

  build:
    runs-on: ubuntu-latest
    needs: prepare-workspace

    strategy:
      fail-fast: false
      matrix:
        config: [debug, release, sanitized]

    steps:
      - name: Download Prepared Workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-workspace-${{ github.run_id }}

      - name: Restore Bazel Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-check-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('**/*.bzl', '**/BUILD.bazel', 'MODULE.bazel') }}
          restore-keys: |
            bazel-release-${{ runner.os }}-

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2

      - name: Build
        run: bazel build //... --config=${{ matrix.config }}

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release, asan]

    steps:
      - name: Download Prepared Workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-workspace-${{ github.run_id }}

      - name: Restore Bazel Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-check-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('**/*.bzl', '**/BUILD.bazel', 'MODULE.bazel') }}
          restore-keys: |
            bazel-release-${{ runner.os }}-

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2

      - name: Test
        run: bazel test //... --config=${{ matrix.config }}
