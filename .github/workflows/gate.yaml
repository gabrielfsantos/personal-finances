name: Gate

on:
  push:
    branches:
      - 'mergify/merge-queue/**'

permissions:
  contents: read

jobs:
  build-gate:
    name: Build Gate (${{ matrix.config }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config: [release, sanitized, tsan]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2

      - name: Restore Bazel Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-gate-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('**/*.bzl', '**/BUILD.bazel', '**/MODULE.bazel', '.bazelversion', '.bazelrc') }}
          restore-keys: |
            bazel-gate-${{ runner.os }}-${{ matrix.config }}-

      - name: Build and Run Tests (${{ matrix.config }})
        run: bazel test //... --config=${{ matrix.config }}
